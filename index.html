<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baking Cost Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <h1>Baking Cost Calculator</h1>

        <section class="card">
            <h2>Add an ingredient</h2>

            <div class="form-row">
                <input type="text" id="name-input" placeholder="Name (e.g. Flour)">
                <input type="number" id="price-input" placeholder="Price paid ($)" min="0" step="0.01">
                <input type="number" id="size-input" placeholder="Package size" min="0" step="any">
                <select id="unit-select">
                    <option value="g">g</option>
                    <option value="kg">kg</option>
                    <option value="ml">ml</option>
                    <option value="L">L</option>
                    <option value="each">each</option>
                </select>
                <button id="add-btn">Add</button>
            </div>

            <p id="message"></p>
        </section>

        <section class="card">
            <h2>Your ingredients</h2>
            <p id="empty-text">No ingredients yet. Add your first one above!</p>

            <table id="ingredient-table">
                <thead>
                    <tr>
                        <th>Ingredient</th>
                        <th>Paid</th>
                        <th>Package</th>
                        <th>Cost per unit</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="ingredient-list"></tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
